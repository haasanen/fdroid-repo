name: Update F-Droid repo

# Two triggers (push + poll):
#  - workflow_dispatch: the source repos' release CI dispatches this via API
#    right after publishing (instant push mechanism).
#  - schedule: weekly poll as a safety net (checks for new release APKs).
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fdroid-repo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Setup Java 17 (jarsigner, keytool)
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install fdroidserver
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv .venv
          uv pip install -p .venv/bin/python fdroidserver==2.4.5

      - name: Restore repo signing keystore (secret -> file, never committed)
        env:
          REPO_KEYSTORE_BASE64: ${{ secrets.REPO_KEYSTORE_BASE64 }}
          REPO_STORE_PASS: ${{ secrets.REPO_STORE_PASS }}
        run: |
          echo "$REPO_KEYSTORE_BASE64" | base64 -d > repo.jks
          chmod 600 repo.jks
          keytool -list -keystore repo.jks -storetype JKS -storepass "$REPO_STORE_PASS" > /dev/null
          echo "keystore loads OK"

      - name: Download latest APKs + build signed index
        env:
          FDROID_STORE_PASS: ${{ secrets.REPO_STORE_PASS }}
          FDROID_KEY_PASS: ${{ secrets.REPO_KEY_PASS }}
        run: .venv/bin/python update_repo.py

      - name: Verify signed index (client contract)
        run: .venv/bin/python verify_index.py

      - name: Stage Pages site (repo/ under site root -> .../fdroid-repo/repo/)
        run: |
          mkdir -p pages-site/repo
          cp -r repo/. pages-site/repo/
          rm -rf pages-site/repo/status pages-site/repo/diff
          ls -la pages-site/repo

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: pages-site

      - name: Unique Pages build version
        id: shaout
        run: echo "version=$(printf '%040x' "$GITHUB_RUN_ID")" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4.0.5
        env:
          # deploy-pages takes the Pages build version from GITHUB_SHA (there is
          # no input for it). This repo's *content* (index + APKs) is CI-built
          # and usually rebuilds from an unchanged commit, so every deploy since
          # 2026-10-28 registered the SAME version 37c3f28... and Pages kept
          # serving the first content built for it -- the 2026-11-09 dispatches
          # that carried Fennec 1580027 both "succeeded" while the live index
          # still showed 1580026. A per-run unique (SHA-shaped) version makes
          # every successful update actually swap the served content.
          GITHUB_SHA: ${{ steps.shaout.outputs.version }}
