Name: Calendar
Summary: AOSP Calendar fork with a working event editor
Description: |
  A fork of the AOSP Calendar app (packages/apps/Calendar, 2018 full tree),
  rebranded and maintained as net.haasanen.calendar.

  Unlike the reduced calendar shipped in recent AOSP (which removed event
  creation), this build keeps the complete original feature set: day, week
  and month views, event creation and editing with recurrence, reminders,
  search, agenda, and home-screen widgets. Events are read from and written
  to the standard Android system calendar provider, so they are visible to
  every other app on the device. No Google services are required.

  CalDAV account support is in development.
Categories:
  - Calendar &amp; Agenda
